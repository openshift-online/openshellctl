version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Generated mocks and deepcopy are exempt from doc-comment lints.
      - path: (mock/.*|zz_.*)\.go
        linters:
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openshift-online/openshellctl
