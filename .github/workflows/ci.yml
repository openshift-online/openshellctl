name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: verify
        run: make verify

      - name: test
        run: make test

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

      - name: image
        run: make image CONTAINER_ENGINE=docker
